<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline TTS</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      .card { max-width: 720px; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
      textarea { width: 100%; min-height: 120px; font-size: 16px; padding: 10px; }
      button { padding: 10px 16px; font-size: 16px; border-radius: 10px; border: 0; cursor: pointer; }
      .primary { background: black; color: white; }
      .row { display:flex; gap: 12px; align-items: center; margin-top: 12px; }
      audio { width: 100%; margin-top: 12px; }
      .hint { color: #555; font-size: 14px; }
      .ok { color: #0a7a0a; }
      .err { color: #a00; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
